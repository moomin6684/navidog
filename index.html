<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="내비독">
<link rel="preload" href="fonts/MaplestoryBold.woff" as="font" type="font/woff" crossorigin>
<meta name="theme-color" content="#FFF8E7">
<title>내비독 · 강아지 산책 코스 내비게이션 프로토타입</title>
<meta name="description" content="오늘도 같이, 동네 한 바퀴. 우리 강아지에게 맞는 산책 코스를 추천하고 길을 안내하는 내비독 프로토타입">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
@font-face{font-family:'Maplestory';src:url(fonts/MaplestoryBold.woff) format('woff');font-weight:700;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation;background:#FFF8E7;font-family:'Noto Sans KR',sans-serif;color:#2e4637;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(circle at 15% 20%,#E4F7D9 0,transparent 45%),radial-gradient(circle at 85% 80%,#DDF1FF 0,transparent 40%),#FFF8E7}
header{display:flex;align-items:center;gap:14px}
header h1{margin:0;font:700 22px 'Maplestory','Noto Sans KR',sans-serif;color:#1f7a3a}
header span{font-size:13px;color:#62786a}
#restart{border:1.5px solid #1f9d4a;background:#fff;color:#1f7a3a;border-radius:999px;padding:6px 14px;font:700 13px 'Noto Sans KR';cursor:pointer;box-shadow:0 2px 0 #1f9d4a33}
#stage{position:relative;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #2e4637,0 24px 60px #2e463744;background:#fff}
#device{position:absolute;left:0;top:0;width:393px;height:852px;transform-origin:0 0;overflow:hidden}
.screen{position:absolute;left:0;top:0;overflow:hidden;background:transparent;user-select:none;-webkit-user-select:none}
.lyr{position:absolute;pointer-events:none;max-width:none}
.txt{position:absolute;pointer-events:none;font-kerning:normal;-webkit-font-smoothing:antialiased}
.vis{position:absolute}
.hot{position:absolute;cursor:pointer;touch-action:manipulation}
.scr{position:absolute;overflow:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scr::-webkit-scrollbar{display:none}
.scr.vert{overflow-y:auto}.scr.horiz{overflow-x:auto}.scr.both{overflow:auto;cursor:grab}
.scr .content{position:relative}
.slice{position:absolute;left:0;background-repeat:no-repeat}
.overlay{position:absolute;inset:0;transition:opacity .18s}
.screen.flash .hot{animation:flash .6s ease}
@keyframes flash{0%,100%{background:transparent}30%{background:rgba(64,140,255,.22);outline:2px solid rgba(64,140,255,.6)}}
footer{font-size:12px;color:#8a9a8f}
/* 눌림 피드백 */
.hot{transition:background-color .12s ease;border-radius:14px}
.hot:not(.full):active{background-color:rgba(31,74,45,.08)}
/* 지도 */
.map{position:absolute;overflow:hidden;touch-action:none;background:#F6F0DF;cursor:grab;contain:strict}
.map.moving{cursor:grabbing}
.map .world{position:absolute;left:0;top:0;transform-origin:0 0}
.map.moving .world{will-change:transform}
.map .lvl{position:absolute;inset:0}
.map .tile{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none}
.map .lvl .tile{opacity:0;transition:opacity .18s ease}
.map .lvl .tile.on{opacity:1}
.map .ov{position:absolute;inset:0;pointer-events:none}
.map .mk{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
.map .mk.tap{pointer-events:auto;cursor:pointer}
.map .mk.tap:active{filter:brightness(.92)}
/* 스켈레톤 */
.skel{background:#FFF9EC}
.skel-bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(14px) saturate(1.05);opacity:.8}
.skel-veil{position:absolute;inset:0;background:rgba(255,249,236,.4)}
.skel-blk{position:absolute;background:linear-gradient(100deg,rgba(236,241,231,.92) 30%,rgba(255,255,255,.98) 50%,rgba(236,241,231,.92) 70%);background-size:300% 100%;animation:shimmer 1.3s ease-in-out infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
/* 스플래시 */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(circle at 20% 15%,#E4F7D9 0,transparent 50%),radial-gradient(circle at 85% 85%,#DDF1FF 0,transparent 45%),#FFF8E7;transition:opacity .35s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{width:112px;height:112px;border-radius:50%;background:#9CC5D4 url(icons/icon-192.png) center/cover;box-shadow:0 8px 22px rgba(23,58,48,.18);animation:bob 1.6s ease-in-out infinite}
#splash h2{margin:6px 0 0;font:700 30px 'Maplestory','Noto Sans KR',sans-serif;color:#1f7a3a}
#splash p{margin:0;font-size:14px;color:#62786a}
#splash .bar{width:160px;height:6px;border-radius:99px;background:#E3EEDC;overflow:hidden;margin-top:10px}
#splash .bar i{display:block;height:100%;width:4%;border-radius:99px;background:#3DAA5A;transition:width .25s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* 알림 */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;max-width:88vw;
  background:#2e4637;color:#fff;font:500 14px 'Noto Sans KR',sans-serif;padding:11px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(23,58,48,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:reduce){#splash .logo,.skel-blk{animation:none}}
/* 움직임: 화면 전환·카드 넘기기·누름 물결 */
.screen.lift{box-shadow:-10px 0 28px rgba(23,58,48,.16)}
.screen .dim{position:absolute;inset:0;background:rgba(23,40,30,.12);pointer-events:none;z-index:99}
.swipe-band{position:absolute;left:0;width:393px;overflow:hidden;z-index:5;background:#FFFBEF;pointer-events:none}
.card-patch{position:absolute;left:0;width:393px;height:19px;z-index:40;pointer-events:none;user-select:none}.card-patch.pin{z-index:6}
.swipe-track{position:absolute;inset:0;will-change:transform}
.hot{overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(31,74,45,.14) 0,rgba(31,74,45,.08) 60%,transparent 70%);pointer-events:none}
.scr .slice{transition:top .3s cubic-bezier(.22,.8,.24,1)}
/* 코스 확인 중 */
.loader{background:#FFFBEF}
.loader>*{position:absolute}
.ld-status{left:0;top:0;width:393px;height:54px}
.ld-bar{left:20px;top:62px;width:353px;height:40px}
.loader .paws{left:0;top:582px;fill:#83A889;opacity:.14;overflow:visible}
.paw{opacity:0;transform-box:fill-box;transform-origin:center;animation:pawstep 2.6s ease-out infinite}
@keyframes pawstep{0%{opacity:0;transform:scale(.4)}7%{opacity:1;transform:scale(1.12)}12%{transform:none}62%{opacity:1}80%,100%{opacity:0}}
.ld-dog{left:87px;top:238px;width:220px;height:220px;transform-origin:50% 92%;animation:sniff 1.8s ease-in-out infinite}
@keyframes sniff{0%,100%{transform:translate(0,0) rotate(0)}22%{transform:translate(-5px,-7px) rotate(-4deg)}50%{transform:translate(0,0) rotate(0)}72%{transform:translate(5px,-7px) rotate(4deg)}}
.ld-shadow{left:132px;top:446px;width:130px;height:14px;border-radius:50%;background:rgba(46,70,55,.09);animation:shadow 1.8s ease-in-out infinite}
@keyframes shadow{0%,50%,100%{transform:scaleX(1)}22%,72%{transform:scaleX(.86);opacity:.7}}
.ld-sparkle{left:77px;top:240px;width:18px;height:18px;animation:twinkle 1.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.7) rotate(0);opacity:.6}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
.ld-heart{left:299px;top:278px;width:13px;height:12px;animation:float 2.2s ease-in-out infinite}
@keyframes float{0%{transform:translateY(4px) scale(.8);opacity:0}25%{opacity:1}70%{transform:translateY(-14px) scale(1.05);opacity:1}100%{transform:translateY(-22px) scale(.9);opacity:0}}
.ld-dot{left:85px;top:264px;width:7px;height:7px;border-radius:50%;background:#A9CFA0;animation:twinkle 1.4s .5s ease-in-out infinite}
.ld-title{left:20px;top:480px;width:353px;font:700 28px/36px 'Maplestory','Noto Sans KR',sans-serif;color:#2E4637;text-align:center;white-space:pre-line;animation:rise .5s cubic-bezier(.22,.8,.24,1) both}
.ld-sub{left:20px;top:574px;width:353px;font:400 14px/22px 'Noto Sans KR',sans-serif;color:#627869;text-align:center;animation:rise .5s .08s cubic-bezier(.22,.8,.24,1) both}
.ld-sub span{display:inline-block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ld-dots{left:161px;top:640px;width:72px;height:16px;display:flex;gap:12px}
.ld-dots i{width:16px;height:16px;border-radius:50%;box-sizing:border-box;border:1.5px solid #1EA84A;background:#1EA84A;animation:hop 1.05s ease-in-out infinite}
.ld-dots i:nth-child(2){background:#FFD84D;animation-delay:.15s}
.ld-dots i:nth-child(3){background:#9CC5D4;animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:none}30%{transform:translateY(-8px) scale(1.08)}}
.ld-home{left:130px;top:838px;width:134px;height:5px;border-radius:99px;background:#2E4637}
@media (prefers-reduced-motion:reduce){.paw,.ld-dog,.ld-shadow,.ld-sparkle,.ld-heart,.ld-dot,.ld-dots i{animation:none}.paw{opacity:1}}
/* 지도: 현재 위치 버튼·내 위치 */
.hot.gps{border-radius:50%;background:#fff;box-shadow:0 0 0 1px #D6EBD0,0 2px 6px rgba(23,58,48,.08);display:flex;align-items:center;justify-content:center;color:#184133;transition:color .2s ease,transform .15s ease}
.hot.gps:active{transform:scale(.94)}
.hot.gps.on{color:#1E88FF}
.map .me-halo{position:absolute;left:0;top:0;width:0;height:0}
.map .me-halo i,.map .me-halo::after{content:'';position:absolute;left:-32px;top:-32px;width:64px;height:64px;border-radius:50%;opacity:0;pointer-events:none}
.map .me-halo i{background:rgba(30,136,255,.22)}
.map.follow .me-halo i{animation:mehalo 2.2s ease-out infinite}
.map .me-halo.ping::after{border:3px solid #1E88FF;box-sizing:border-box;animation:meping .9s ease-out 1}
@keyframes mehalo{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.1);opacity:0}}
@keyframes meping{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.9);opacity:0}}
/* 하단 시트(평소 거리 입력) */
.sheet-under{position:absolute;inset:0;pointer-events:none}
.sheet-dim{position:absolute;inset:0;background:rgba(20,36,28,.42);border-radius:0!important;cursor:default}
.sheet-dim:active{background-color:rgba(20,36,28,.42)!important}
.sheet{position:absolute;left:0;width:393px;background:#FFFBEF;border-radius:28px 28px 0 0;box-shadow:0 -6px 24px rgba(23,58,48,.14);overflow:hidden;touch-action:none}
.sheet-seg{position:absolute;left:0;width:393px;overflow:hidden}
.sheet-grab{position:absolute;left:176px;top:10px;width:41px;height:5px;border-radius:99px;background:#D3DCCF}
.hot.sheet-close{border-radius:50%}
.sheet-close span{display:flex;width:36px;height:36px;margin:4px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #DCEBD5;align-items:center;justify-content:center;color:#183B30}
@media (prefers-reduced-motion:reduce){.map.follow .me-halo i{animation:none}}
body.mobile{gap:0;background:#FFF9EC;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body.mobile header,body.mobile footer{display:none}
body.mobile #stage{border-radius:0;box-shadow:none}
.dog{position:absolute;pointer-events:none}
.dog-pl{position:absolute;left:0;top:0;width:100%;height:100%}
.dog-win{position:absolute;overflow:hidden}
.dog-strip{position:absolute;left:0;top:0;height:100%}
.dog-strip{background-repeat:no-repeat}
</style>
</head>
<body>
<div id="splash"><div class="logo"></div><h2>내비독</h2><p>오늘도 같이, 동네 한 바퀴</p><div class="bar"><i></i></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<header><h1>내비독</h1><span>강아지 산책 코스 내비게이션 · 프로토타입</span><button id="restart">처음부터</button></header>
<div id="stage"><div id="device"></div></div>
<footer>화면을 눌러 보세요. 누를 수 있는 곳이 파랗게 표시돼요. 지도는 끌어서 옮기고, 휠·핀치·두 번 클릭(휴대폰은 두 번 톡 한 뒤 위아래로 끌기)으로 확대·축소할 수 있어요.</footer>
<script src="data.js?v=11"></script>
<script src="map/maps.js?v=8"></script>
<script src="lqip.js?v=8"></script>
<script src="player.js?v=10"></script>
</body>
</html>
